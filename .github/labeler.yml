enhancement:
  - head-branch: ['^feat/']

bug:
  - head-branch: ['^fix/']

documentation:
  - head-branch: ['^docs/']

ci:
  - head-branch: ['^ci/']
  - changed-files:
      - any-glob-to-any-file: ['.github/**', '.lute/**']

test:
  - head-branch: ['^test/']
  - changed-files:
      - any-glob-to-any-file: ['tests/**']

refactor:
  - head-branch: ['^refactor/']

chore:
  - head-branch: ['^chore/']

release:
  - head-branch: ['^release/']