name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  branch-name:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(feat|fix|docs|ci|test|refactor|chore|release)/[a-z0-9._-]+$ ]]; then
            echo "Branch '$BRANCH' must be <type>/<name>, for example feat/stopwatch-class"
            exit 1
          fi

  check:
    name: Format, lint, type check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # installs every tool pinned in rokit.toml
      - uses: CompeyDev/setup-rokit@v0.2.1

      # generates the @std/@lute type definitions referenced by .luaurc
      - name: Set up Lute
        run: lute setup

      - name: Run checks
        run: lute run .lute/ci.luau

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Moonwave docs
        run: npx --yes moonwave@latest build

      # only keep the built site if it will be deployed
      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy-docs:
    name: Deploy docs
    # only deploy from master, and only once every check has passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [check, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # never cancel a deployment halfway; queue the next one instead
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4